<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ansmall-auth-system</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        margin: 24px;
        max-width: 920px;
      }
      code,
      pre {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
      }
      input {
        padding: 8px 10px;
        width: 320px;
        max-width: 100%;
      }
      button {
        padding: 8px 12px;
        cursor: pointer;
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
        margin: 8px 0;
      }
      .card {
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 16px;
        margin: 14px 0;
      }
      .muted {
        color: #666;
      }
      pre {
        background: #f7f7f7;
        padding: 12px;
        border-radius: 8px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h2>ansmall-auth-system</h2>
    <p class="muted">
      Microservices version: Gateway serves this page and proxies <code>/api</code>
      to the auth service.
    </p>

    <div class="card">
      <div class="row">
        <label>
          Email<br />
          <input id="email" placeholder="you@example.com" />
        </label>
        <label>
          Password<br />
          <input id="password" type="password" placeholder="min 8 chars" />
        </label>
      </div>
      <div class="row">
        <button id="register">Register</button>
        <button id="login">Login</button>
        <button id="refresh">Refresh</button>
        <button id="me">GET /api/me</button>
        <button id="logout">Logout</button>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <strong>Stored tokens (localStorage)</strong>
        <button id="clear">Clear</button>
      </div>
      <pre id="tokens"></pre>
    </div>

    <div class="card">
      <strong>Last response</strong>
      <pre id="out"></pre>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
